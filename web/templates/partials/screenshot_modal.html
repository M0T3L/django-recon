<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/85 backdrop-blur-md"
     onclick="if(event.target === this) this.remove()">
    <div class="relative max-w-4xl w-full bg-zinc-900 border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
        <div class="flex items-center justify-between p-4 border-b border-white/10 bg-zinc-950">
            <h3 class="text-sm font-mono font-bold text-rose-400 flex items-center space-x-2">
                <i class="fa-solid fa-camera text-rose-400"></i>
                <span>Screenshot Preview: {{.Filename}}</span>
            </h3>
            <button onclick="this.closest('.fixed').remove()" class="text-zinc-400 hover:text-white text-xs px-2 py-1 rounded-full hover:bg-white/10 transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-4 bg-zinc-950 flex justify-center max-h-[80vh] overflow-auto">
            <img src="{{.URLPath}}" alt="Subdomain Screenshot" class="rounded-xl border border-white/10 max-w-full object-contain shadow-2xl" />
        </div>
    </div>
</div>
