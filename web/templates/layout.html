<!DOCTYPE html>
<html lang="en" class="dark h-full bg-[#090b0c] text-zinc-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Django Recon &bull; Oatmeal Mist Mona Theme{{end}}</title>
    <!-- Google Fonts: Mona Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mona+Sans:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mist: {
                            100: '#f2f4f7',
                            200: '#eaecf0',
                            300: '#d0d5dd',
                            400: '#98a2b3',
                            500: '#667085',
                            600: '#475467',
                            700: '#344054',
                            800: '#1d2939',
                            900: '#101828',
                            950: '#090b0c'
                        }
                    },
                    fontFamily: {
                        display: ['Mona Sans', 'Inter', 'sans-serif'],
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090b0c;
            font-family: 'Inter', system-ui, sans-serif;
            color: #d0d5dd;
        }

        h1, h2, h3, h4, .font-display {
            font-family: 'Mona Sans', 'Inter', sans-serif;
        }

        .protocol-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        .oatmeal-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="h-screen flex flex-col text-mist-300 relative oatmeal-grid overflow-hidden antialiased">
    <!-- Top Navigation Bar — compact h-12 -->
    <header class="shrink-0 border-b border-white/10 bg-[#090b0c]/90 backdrop-blur-md z-40">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 h-12 flex items-center justify-between">
            <!-- Brand / Logo -->
            <a href="/" class="text-sm font-display font-bold tracking-tight text-white flex items-center">
                DJANGO <span class="text-[10px] font-mono text-mist-400 bg-white/5 px-1.5 py-px rounded-full border border-white/10 ml-1.5">v3.0</span>
            </a>

            <!-- Nav Links -->
            <nav class="flex items-center space-x-1 text-xs font-medium">
                <a href="/" class="px-3.5 py-1 rounded-full transition-all flex items-center space-x-1.5 {{if eq .ActivePage "dashboard"}}text-mist-950 bg-white font-semibold shadow-sm{{else}}text-mist-400 hover:text-white hover:bg-white/5{{end}}">
                    <i class="fa-solid fa-chart-pie text-[10px]"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/subdomains" class="px-3.5 py-1 rounded-full transition-all flex items-center space-x-1.5 {{if eq .ActivePage "subdomains"}}text-mist-950 bg-white font-semibold shadow-sm{{else}}text-mist-400 hover:text-white hover:bg-white/5{{end}}">
                    <i class="fa-solid fa-network-wired text-[10px]"></i>
                    <span>Subdomains</span>
                </a>
                <a href="/findings" class="px-3.5 py-1 rounded-full transition-all flex items-center space-x-1.5 {{if eq .ActivePage "findings"}}text-mist-950 bg-white font-semibold shadow-sm{{else}}text-mist-400 hover:text-white hover:bg-white/5{{end}}">
                    <i class="fa-solid fa-shield-halved text-[10px]"></i>
                    <span>Findings</span>
                </a>
            </nav>

            <!-- Status Indicator -->
            <div class="hidden sm:flex items-center space-x-1.5 text-[10px] font-mono text-mist-400 border border-white/10 bg-white/[0.02] px-2.5 py-1 rounded-full">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-mist-200">Operational</span>
            </div>
        </div>
    </header>

    <!-- Main Content — fills remaining viewport -->
    <main class="flex-1 min-h-0 overflow-hidden">
        <div class="h-full max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div id="toast-container" class="fixed top-14 right-5 z-50 flex flex-col space-y-2"></div>
            {{template "content" .}}
        </div>
    </main>

    <!-- Footer — thin inline bar -->
    <footer class="shrink-0 border-t border-white/5 py-1.5 bg-[#090b0c]">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center text-[10px] text-mist-500 font-mono">
            <span>Oatmeal Mist &bull; Dual-Pipeline Recon</span>
            <span class="flex items-center space-x-1.5">
                <i class="fa-solid fa-circle-check text-emerald-400 text-[8px]"></i>
                <span>v3.0.0</span>
            </span>
        </div>
    </footer>

    <!-- Modal Container for Screenshots / Assets -->
    <div id="modal-container"></div>
</body>
</html>
